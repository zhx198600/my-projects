{% extends 'base.html' %}

{% block title %}登录 - OPPO 工单管理系统{% endblock %}

{% block content %}
<style>
    .login-container {
        max-width: 400px;
        margin: 80px auto;
        padding: 40px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .login-header {
        text-align: center;
        margin-bottom: 40px;
    }
    .login-header h1 {
        font-size: 24px;
        color: #1a73e8;
        margin-bottom: 10px;
    }
    .login-header p {
        color: #666;
        font-size: 14px;
    }
    .role-selection {
        margin-bottom: 30px;
    }
    .role-option {
        display: flex;
        align-items: center;
        padding: 15px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        margin-bottom: 10px;
        cursor: pointer;
        transition: all 0.3s;
    }
    .role-option:hover {
        border-color: #1a73e8;
        background-color: #f0f7ff;
    }
    .role-option.selected {
        border-color: #1a73e8;
        background-color: #e8f0fe;
    }
    .role-option input[type="radio"] {
        width: 20px;
        height: 20px;
        margin-right: 12px;
        cursor: pointer;
    }
    .role-option label {
        font-size: 16px;
        font-weight: 500;
        color: #333;
        cursor: pointer;
    }
    .role-desc {
        font-size: 12px;
        color: #999;
        margin-top: 4px;
    }
    .login-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
    }
    .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(26, 115, 232, 0.4);
    }
    .login-btn:active {
        transform: translateY(0);
    }
    .error-message {
        background-color: #ffebee;
        color: #c62828;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 20px;
        font-size: 14px;
        text-align: center;
    }
</style>

<div class="login-container">
    <div class="login-header">
        <h1>OPPO 工单管理系统</h1>
        <p>请选择角色进行登录</p>
    </div>

    {% if error_message %}
    <div class="error-message">{{ error_message }}</div>
    {% endif %}

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        
        <div class="role-selection">
            <div class="role-option" id="super-admin-option">
                <input type="radio" id="super_admin" name="role" value="super_admin" checked>
                <label for="super_admin">
                    超级管理员
                    <div class="role-desc">拥有系统全部权限</div>
                </label>
            </div>
        </div>

        <button type="submit" class="login-btn">登 录</button>
    </form>
</div>

<script>
    document.querySelectorAll('.role-option').forEach(function(option) {
        option.addEventListener('click', function() {
            var radio = this.querySelector('input[type="radio"]');
            radio.checked = true;
            
            document.querySelectorAll('.role-option').forEach(function(opt) {
                opt.classList.remove('selected');
            });
            this.classList.add('selected');
        });
    });
    
    var selectedOption = document.querySelector('.role-option input:checked');
    if (selectedOption) {
        selectedOption.closest('.role-option').classList.add('selected');
    }
</script>
{% endblock %}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能新闻内容生成系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            padding: 24px;
        }

        .card-title {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.95rem;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .form-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 12px 32px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(17, 153, 142, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #555;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .news-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .news-item {
            padding: 16px;
            border: 2px solid #f0f0f0;
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .news-item:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .news-item.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
        }

        .news-title {
            font-size: 1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-meta {
            display: flex;
            gap: 12px;
            font-size: 0.85rem;
            color: #888;
        }

        .news-tag {
            background: #f0f0f0;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #666;
        }

        .result-card {
            margin-top: 20px;
            border-top: 2px solid #f0f0f0;
            padding-top: 20px;
        }

        .article-title {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .article-content {
            background: #fafafa;
            padding: 20px;
            border-radius: 8px;
            line-height: 1.8;
            color: #444;
            white-space: pre-wrap;
            max-height: 600px;
            overflow-y: auto;
        }

        .image-container {
            margin-top: 20px;
        }

        .generated-image {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f0f0f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #aaa;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .platform-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .platform-btn {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .platform-btn:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .platform-btn.active {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            opacity: 0.6;
            transition: all 0.3s ease;
        }

        .step.active {
            opacity: 1;
        }

        .step-number {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 1.2rem;
        }

        .step.active .step-number {
            background: white;
            color: #667eea;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .toast.success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .toast.error {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📰 智能新闻内容生成系统</h1>
            <p>一键提取新闻，智能生成多平台优质内容</p>
        </div>

        <div class="step-indicator">
            <div class="step active" id="step1">
                <div class="step-number">1</div>
                <span>输入网址</span>
            </div>
            <div class="step" id="step2">
                <div class="step-number">2</div>
                <span>选择新闻</span>
            </div>
            <div class="step" id="step3">
                <div class="step-number">3</div>
                <span>生成内容</span>
            </div>
        </div>

        <div class="main-grid">
            <div class="card">
                <div class="card-title">输入信息</div>
                
                <div class="form-group">
                    <label class="form-label">新闻网页URL</label>
                    <input type="url" class="form-input" id="urlInput" 
                           placeholder="请输入新闻网页地址，例如：https://news.example.com"
                           value="https://news.sina.com.cn/">
                </div>

                <div class="form-group">
                    <label class="form-label">选择新闻类型</label>
                    <select class="form-select" id="newsTypeSelect">
                        {% for type in news_types %}
                        <option value="{{ type }}">{{ type }}</option>
                        {% endfor %}
                    </select>
                </div>

                <button class="btn btn-primary" id="extractBtn" onclick="extractNews()">
                    🔍 提取最新10条新闻
                </button>

                <div class="card-title" style="margin-top: 30px;">
                    已提取的新闻列表
                </div>

                <div class="news-list" id="newsList">
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <p>请先输入网址并提取新闻</p>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">内容生成</div>

                <div class="form-group">
                    <label class="form-label">已选择的新闻</label>
                    <div id="selectedNewsInfo" class="empty-state" style="padding: 20px; background: #fafafa; border-radius: 8px;">
                        <div class="empty-state-icon" style="padding: 20px;">
                            <div class="empty-state-icon" style="font-size: 2rem;">📝</div>
                            <p>请从左侧选择一条新闻</p>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">选择发布平台</label>
                    <div class="platform-buttons" id="platformButtons">
                        {% for platform in platform_types %}
                        <button class="platform-btn {% if loop.first %}active{% endif %}" 
                                data-platform="{{ platform }}"
                                onclick="selectPlatform(this)">
                            {{ platform }}
                        </button>
                        {% endfor %}
                    </div>
                </div>

                <div class="action-buttons">
                    <button class="btn btn-success" id="generateArticleBtn" onclick="generateArticle()" disabled>
                        ✍️ 生成文章
                    </button>
                    <button class="btn btn-primary" id="generateImageBtn" onclick="generateImage()" disabled>
                        🖼️ 生成配图
                    </button>
                </div>

                <div class="result-card" id="resultCard" style="display: none;">
                    <div class="card-title" style="margin-top: 0; padding-top: 0;">
                        生成结果
                    </div>
                    
                    <div id="articleResult" style="display: none;">
                        <h3 class="article-title" id="generatedTitle"></h3>
                        <div class="article-content" id="generatedContent"></div>
                    </div>

                    <div id="imageResult" style="display: none;" class="image-container">
                        <img class="generated-image" id="generatedImage" alt="生成的配图">
                    </div>

                    <div class="action-buttons">
                        <button class="btn btn-secondary" onclick="copyContent()">
                            📋 复制文章
                        </button>
                        <button class="btn btn-secondary" onclick="regenerateContent()">
                            🔄 重新生成
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let newsData = [];
        let selectedNews = null;
        let selectedPlatform = '{{ platform_types[0] }}';
        let generatedArticle = null;

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        function setStep(step) {
            document.querySelectorAll('.step').forEach((el, index) => {
                el.classList.toggle('active', index < step);
            });
        }

        async function extractNews() {
            const url = document.getElementById('urlInput').value.trim();
            const newsType = document.getElementById('newsTypeSelect').value;
            
            if (!url) {
                showToast('请输入新闻网页URL', 'error');
                return;
            }

            const btn = document.getElementById('extractBtn');
            btn.disabled = true;
            btn.innerHTML = '⏳ 提取中...';

            const newsList = document.getElementById('newsList');
            newsList.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <p>正在提取新闻，请稍候...</p>
                </div>
            `;

            try {
                const response = await fetch('/api/extract', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        url: url,
                        news_type: newsType,
                        limit: 10
                    })
                });

                const result = await response.json();

                if (result.success) {
                    newsData = result.data;
                    renderNewsList(newsData);
                    setStep(2);
                    showToast(`成功提取 ${result.count} 条新闻`);
                } else {
                    throw new Error(result.error || '提取失败');
                }
            } catch (error) {
                newsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">❌</div>
                        <p>提取失败: ${error.message}</p>
                    </div>
                `;
                showToast('提取新闻失败: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🔍 提取最新10条新闻';
            }
        }

        function renderNewsList(newsList) {
            const container = document.getElementById('newsList');
            
            if (newsList.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>未能提取到新闻</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = newsList.map(news => `
                <div class="news-item" data-id="${news.id}" onclick="selectNews(${news.id})">
                    <div class="news-title">${news.title}</div>
                    <div class="news-meta">
                        <span class="news-tag">${news.news_type}</span>
                        <span>ID: ${news.id}</span>
                    </div>
                </div>
            `).join('');
        }

        function selectNews(id) {
            selectedNews = newsData.find(n => n.id === id);
            
            document.querySelectorAll('.news-item').forEach(item => {
                item.classList.toggle('selected', item.dataset.id == id);
            });

            const infoDiv = document.getElementById('selectedNewsInfo');
            infoDiv.innerHTML = `
                <div style="font-weight: 600; color: #333; margin-bottom: 8px;">
                    ${selectedNews.title}
                </div>
                <div style="font-size: 0.9rem; color: #666; line-height: 1.5;">
                    ${selectedNews.summary}
                </div>
                <div style="margin-top: 12px;">
                    <span class="news-tag">${selectedNews.news_type}</span>
                </div>
            `;

            document.getElementById('generateArticleBtn').disabled = false;
            document.getElementById('generateImageBtn').disabled = false;
            
            setStep(3);
        }

        function selectPlatform(btn) {
            document.querySelectorAll('.platform-btn').forEach(b => {
                b.classList.remove('active');
            });
            btn.classList.add('active');
            selectedPlatform = btn.dataset.platform;
        }

        async function generateArticle() {
            if (!selectedNews) {
                showToast('请先选择一条新闻', 'error');
                return;
            }

            const btn = document.getElementById('generateArticleBtn');
            btn.disabled = true;
            btn.innerHTML = '⏳ 生成中...';

            try {
                const response = await fetch('/api/generate/article', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        news_data: selectedNews,
                        platform_type: selectedPlatform
                    })
                });

                const result = await response.json();

                if (result.success) {
                    generatedArticle = result.data;
                    showArticleResult(result.data);
                    showToast('文章生成成功！');
                } else {
                    throw new Error(result.error || '生成失败');
                }
            } catch (error) {
                showToast('生成文章失败: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '✍️ 生成文章';
            }
        }

        async function generateImage() {
            if (!selectedNews) {
                showToast('请先选择一条新闻', 'error');
                return;
            }

            const btn = document.getElementById('generateImageBtn');
            btn.disabled = true;
            btn.innerHTML = '⏳ 生成中...';

            try {
                const response = await fetch('/api/generate/image', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        news_data: selectedNews,
                        platform_type: selectedPlatform
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showImageResult(result.data);
                    showToast('配图生成成功！');
                } else {
                    throw new Error(result.error || '生成失败');
                }
            } catch (error) {
                showToast('生成配图失败: ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🖼️ 生成配图';
            }
        }

        function showArticleResult(data) {
            const resultCard = document.getElementById('resultCard');
            const articleResult = document.getElementById('articleResult');
            
            resultCard.style.display = 'block';
            articleResult.style.display = 'block';
            
            document.getElementById('generatedTitle').textContent = data.title;
            document.getElementById('generatedContent').textContent = data.content;
        }

        function showImageResult(data) {
            const resultCard = document.getElementById('resultCard');
            const imageResult = document.getElementById('imageResult');
            
            resultCard.style.display = 'block';
            imageResult.style.display = 'block';
            
            const img = document.getElementById('generatedImage');
            img.src = data.image_url;
            img.alt = '生成的配图';
        }

        function copyContent() {
            if (!generatedArticle) {
                showToast('没有可复制的内容', 'error');
                return;
            }

            const text = generatedArticle.title + '\n\n' + generatedArticle.content;
            
            navigator.clipboard.writeText(text).then(() => {
                showToast('已复制到剪贴板！');
            }).catch(() => {
                    showToast('复制失败，请手动复制', 'error');
                });
        }

        function regenerateContent() {
            document.getElementById('resultCard').style.display = 'none';
            generatedArticle = null;
            showToast('已清空结果，请重新生成');
        }

        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && e.target.id === 'urlInput') {
                extractNews();
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上岗登记</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">← 返回首页</a>
    
    <div class="header">
      <h1>上岗信息登记</h1>
      <p>请如实填写个人信息</p>
    </div>

    <form id="registerForm">
      <div class="form-group">
        <label for="name">姓名</label>
        <input type="text" id="name" name="name" required placeholder="请输入您的姓名">
      </div>

      <div class="form-group">
        <label for="idCard">身份证号</label>
        <input type="text" id="idCard" name="idCard" required placeholder="请输入18位身份证号" maxlength="18">
      </div>

      <div class="form-group">
        <label for="phone">手机号码</label>
        <input type="tel" id="phone" name="phone" required placeholder="请输入11位手机号码" maxlength="11">
      </div>

      <div class="form-group">
        <label for="gender">性别</label>
        <select id="gender" name="gender" required>
          <option value="">请选择性别</option>
          <option value="男">男</option>
          <option value="女">女</option>
        </select>
      </div>

      <div class="form-group">
        <label for="birthDate">出生日期</label>
        <input type="date" id="birthDate" name="birthDate" required>
      </div>

      <div class="form-group">
        <label for="workType">工种</label>
        <select id="workType" name="workType" required>
          <option value="">请选择工种</option>
          <option value="建筑工人">建筑工人</option>
          <option value="钢筋工">钢筋工</option>
          <option value="木工">木工</option>
          <option value="水电工">水电工</option>
          <option value="焊工">焊工</option>
          <option value="架子工">架子工</option>
          <option value="抹灰工">抹灰工</option>
          <option value="油漆工">油漆工</option>
          <option value="其他">其他</option>
        </select>
      </div>

      <div class="form-group">
        <label for="workYears">工作年限</label>
        <select id="workYears" name="workYears" required>
          <option value="">请选择工作年限</option>
          <option value="1年以下">1年以下</option>
          <option value="1-3年">1-3年</option>
          <option value="3-5年">3-5年</option>
          <option value="5-10年">5-10年</option>
          <option value="10年以上">10年以上</option>
        </select>
      </div>

      <div class="form-group">
        <label for="address">居住地址</label>
        <input type="text" id="address" name="address" required placeholder="请输入详细居住地址">
      </div>

      <div class="form-group">
        <label for="emergencyContact">紧急联系人</label>
        <input type="text" id="emergencyContact" name="emergencyContact" required placeholder="请输入紧急联系人姓名">
      </div>

      <div class="form-group">
        <label for="emergencyPhone">紧急联系电话</label>
        <input type="tel" id="emergencyPhone" name="emergencyPhone" required placeholder="请输入紧急联系人电话" maxlength="11">
      </div>

      <div class="form-group">
        <label>身份证照片</label>
        <div class="id-card-upload">
          <div class="upload-section">
            <div class="upload-label">身份证正面</div>
            <div class="upload-area" id="frontUploadArea">
              <input type="file" id="idCardFront" name="idCardFront" accept="image/*" hidden>
              <div class="upload-placeholder" id="frontPlaceholder">
                <div class="upload-icon">+</div>
                <div class="upload-text">点击上传正面照片</div>
              </div>
              <img id="frontPreview" class="preview-image" alt="身份证正面预览">
              <button type="button" class="remove-btn" id="removeFront" style="display: none;">×</button>
            </div>
          </div>
          <div class="upload-section">
            <div class="upload-label">身份证反面</div>
            <div class="upload-area" id="backUploadArea">
              <input type="file" id="idCardBack" name="idCardBack" accept="image/*" hidden>
              <div class="upload-placeholder" id="backPlaceholder">
                <div class="upload-icon">+</div>
                <div class="upload-text">点击上传反面照片</div>
              </div>
              <img id="backPreview" class="preview-image" alt="身份证反面预览">
              <button type="button" class="remove-btn" id="removeBack" style="display: none;">×</button>
            </div>
          </div>
        </div>
        <div class="upload-hint">支持 JPG、PNG 格式，单张大小不超过 5MB</div>
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn">提交登记</button>
    </form>
  </div>

  <div id="toast" class="toast"></div>
  <div id="loading" class="loading">加载中...</div>

  <script src="js/common.js"></script>
  <script>
    let idCardFrontFile = null;
    let idCardBackFile = null;

    function initImageUpload(inputId, previewId, placeholderId, removeBtnId, uploadAreaId, fileVar) {
      const input = document.getElementById(inputId);
      const preview = document.getElementById(previewId);
      const placeholder = document.getElementById(placeholderId);
      const removeBtn = document.getElementById(removeBtnId);
      const uploadArea = document.getElementById(uploadAreaId);

      uploadArea.addEventListener('click', () => input.click());

      input.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        showLoading('验证图片中...');
        const isValid = await validateImageFile(file);
        hideLoading();

        if (!isValid) {
          input.value = '';
          return;
        }

        if (fileVar === 'front') {
          idCardFrontFile = file;
        } else {
          idCardBackFile = file;
        }

        const reader = new FileReader();
        reader.onload = (event) => {
          preview.src = event.target.result;
          preview.style.display = 'block';
          placeholder.style.display = 'none';
          removeBtn.style.display = 'flex';
          showToast('图片上传成功');
        };
        reader.readAsDataURL(file);
      });

      removeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        input.value = '';
        preview.src = '';
        preview.style.display = 'none';
        placeholder.style.display = 'flex';
        removeBtn.style.display = 'none';
        if (fileVar === 'front') {
          idCardFrontFile = null;
        } else {
          idCardBackFile = null;
        }
      });
    }

    async function loadUserInfo() {
      try {
        const result = await apiRequest('/users/info');
        if (result.success && result.data) {
          const user = result.data;
          document.getElementById('name').value = user.name || '';
          document.getElementById('idCard').value = user.id_card || '';
          document.getElementById('phone').value = user.phone || '';
          document.getElementById('gender').value = user.gender || '';
          document.getElementById('birthDate').value = user.birth_date || '';
          document.getElementById('workType').value = user.work_type || '';
          document.getElementById('workYears').value = user.work_years || '';
          document.getElementById('address').value = user.address || '';
          document.getElementById('emergencyContact').value = user.emergency_contact || '';
          document.getElementById('emergencyPhone').value = user.emergency_phone || '';
        }
      } catch (error) {
        console.error('加载用户信息失败', error);
      }
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const idCard = document.getElementById('idCard').value;
      const phone = document.getElementById('phone').value;
      const emergencyPhone = document.getElementById('emergencyPhone').value;

      if (!validateIdCard(idCard)) {
        showToast('请输入正确的18位身份证号');
        return;
      }

      if (!validatePhone(phone)) {
        showToast('请输入正确的11位手机号码');
        return;
      }

      if (!validatePhone(emergencyPhone)) {
        showToast('请输入正确的紧急联系人电话');
        return;
      }

      if (!idCardFrontFile || !idCardBackFile) {
        showToast('请上传身份证正反面照片');
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = '提交中...';

      try {
        const formData = new FormData();
        formData.append('name', document.getElementById('name').value);
        formData.append('idCard', idCard);
        formData.append('phone', phone);
        formData.append('gender', document.getElementById('gender').value);
        formData.append('birthDate', document.getElementById('birthDate').value);
        formData.append('workType', document.getElementById('workType').value);
        formData.append('workYears', document.getElementById('workYears').value);
        formData.append('address', document.getElementById('address').value);
        formData.append('emergencyContact', document.getElementById('emergencyContact').value);
        formData.append('emergencyPhone', emergencyPhone);
        formData.append('idCardFront', idCardFrontFile);
        formData.append('idCardBack', idCardBackFile);

        const result = await uploadFormData('/users/register', formData);

        if (result.success) {
          showToast('登记成功！');
          setTimeout(() => {
            window.location.href = 'training.html';
          }, 1500);
        } else {
          showToast(result.message || '登记失败，请重试');
        }
      } catch (error) {
        console.error('提交登记失败', error);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '提交登记';
      }
    });

    initImageUpload('idCardFront', 'frontPreview', 'frontPlaceholder', 'removeFront', 'frontUploadArea', 'front');
    initImageUpload('idCardBack', 'backPreview', 'backPlaceholder', 'removeBack', 'backUploadArea', 'back');
    loadUserInfo();
  </script>
</body>
</html>

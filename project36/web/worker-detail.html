<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>人员详情</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="page-header">
      <a href="worker-list.html" class="back-btn">← 返回列表</a>
      <h1 class="page-title">人员详情</h1>
    </div>

    <div class="detail-card" id="workerDetail">
      <div class="loading-text">加载中...</div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <div id="loading" class="loading">加载中...</div>

  <script src="js/common.js"></script>
  <script>
    function getWorkerId() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('id');
    }

    async function loadWorkerDetail() {
      const workerId = getWorkerId();
      if (!workerId) {
        showToast('参数错误');
        return;
      }

      try {
        showLoading();
        const result = await apiRequest(`/users/detail/${workerId}`);
        hideLoading();

        if (result.success && result.data) {
          renderWorkerDetail(result.data);
        } else {
          document.getElementById('workerDetail').innerHTML = 
            '<div class="empty-state">加载失败，请重试</div>';
        }
      } catch (error) {
        hideLoading();
        console.error('加载人员详情失败', error);
        document.getElementById('workerDetail').innerHTML = 
          '<div class="empty-state">加载失败，请重试</div>';
      }
    }

    function renderWorkerDetail(data) {
      const { user, examRecords, agreementRecords } = data;
      const container = document.getElementById('workerDetail');

      const examScore = user.exam_score !== null && user.exam_score !== undefined 
        ? `<span class="score-badge large ${user.exam_score >= 70 ? 'pass' : 'fail'}">${user.exam_score}分</span>`
        : '<span class="score-badge large">未考核</span>';

      const agreementStatus = user.agreement_signed 
        ? '<span class="agreement-badge large signed">已签署</span>'
        : '<span class="agreement-badge large">未签署</span>';

      let examRecordsHtml = '';
      if (examRecords && examRecords.length > 0) {
        examRecords.forEach((record, index) => {
          const isPass = record.score >= 70;
          examRecordsHtml += `
            <div class="record-item">
              <div class="record-header">
                <span class="record-title">第 ${index + 1} 次考核</span>
                <span class="record-score ${isPass ? 'pass' : 'fail'}">${record.score}分</span>
              </div>
              <div class="record-info">
                <div class="info-row">
                  <span class="info-label">考核时间：</span>
                  <span class="info-value">${formatDateTime(record.completed_at)}</span>
                </div>
                <div class="info-row">
                  <span class="info-label">考核结果：</span>
                  <span class="info-value ${isPass ? 'text-pass' : 'text-fail'}">${isPass ? '合格' : '不合格'}</span>
                </div>
              </div>
            </div>
          `;
        });
      } else {
        examRecordsHtml = '<div class="empty-text">暂无考核记录</div>';
      }

      let agreementRecordsHtml = '';
      if (agreementRecords && agreementRecords.length > 0) {
        agreementRecords.forEach((record, index) => {
          agreementRecordsHtml += `
            <div class="record-item">
              <div class="record-header">
                <span class="record-title">第 ${index + 1} 次签署</span>
                <span class="agreement-badge signed">已签署</span>
              </div>
              <div class="record-info">
                <div class="info-row">
                  <span class="info-label">签署时间：</span>
                  <span class="info-value">${formatDateTime(record.signed_at)}</span>
                </div>
              </div>
            </div>
          `;
        });
      } else {
        agreementRecordsHtml = '<div class="empty-text">暂无签署记录</div>';
      }

      const html = `
        <div class="basic-info-section">
          <div class="section-header">
            <h3>👤 基本信息</h3>
          </div>
          <div class="info-grid">
            <div class="info-item">
              <span class="info-label">姓名</span>
              <span class="info-value">${user.name || '--'}</span>
            </div>
            <div class="info-item">
              <span class="info-label">身份证号</span>
              <span class="info-value">${user.id_card || '--'}</span>
            </div>
            <div class="info-item">
              <span class="info-label">手机号</span>
              <span class="info-value">${user.phone || '--'}</span>
            </div>
            <div class="info-item">
              <span class="info-label">性别</span>
              <span class="info-value">${user.gender || '--'}</span>
            </div>
            <div class="info-item">
              <span class="info-label">工种</span>
              <span class="info-value">${user.work_type || '--'}</span>
            </div>
            <div class="info-item">
              <span class="info-label">工龄</span>
              <span class="info-value">${user.work_years || '--'}</span>
            </div>
            <div class="info-item">
              <span class="info-label">居住地址</span>
              <span class="info-value">${user.address || '--'}</span>
            </div>
            <div class="info-item">
              <span class="info-label">紧急联系人</span>
              <span class="info-value">${user.emergency_contact || '--'}</span>
            </div>
            <div class="info-item">
              <span class="info-label">紧急联系电话</span>
              <span class="info-value">${user.emergency_phone || '--'}</span>
            </div>
            <div class="info-item">
              <span class="info-label">登记时间</span>
              <span class="info-value">${formatDateTime(user.created_at)}</span>
            </div>
          </div>
        </div>

        <div class="status-section">
          <div class="section-header">
            <h3>📊 当前状态</h3>
          </div>
          <div class="status-grid">
            <div class="status-item">
              <div class="status-label">安全培训</div>
              <div class="status-value">
                ${user.training_completed 
                  ? '<span class="status-badge pass">已完成</span>' 
                  : '<span class="status-badge">未完成</span>'}
              </div>
            </div>
            <div class="status-item">
              <div class="status-label">考核成绩</div>
              <div class="status-value">${examScore}</div>
            </div>
            <div class="status-item">
              <div class="status-label">责任书签署</div>
              <div class="status-value">${agreementStatus}</div>
            </div>
          </div>
        </div>

        <div class="records-section">
          <div class="section-header">
            <h3>✅ 考核记录</h3>
            <span class="record-count">共 ${examRecords ? examRecords.length : 0} 条记录</span>
          </div>
          <div class="records-list">
            ${examRecordsHtml}
          </div>
        </div>

        <div class="records-section">
          <div class="section-header">
            <h3>📋 责任书签署记录</h3>
            <span class="record-count">共 ${agreementRecords ? agreementRecords.length : 0} 条记录</span>
          </div>
          <div class="records-list">
            ${agreementRecordsHtml}
          </div>
        </div>
      `;

      container.innerHTML = html;
    }

    function formatDateTime(dateStr) {
      if (!dateStr) return '--';
      const date = new Date(dateStr);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hour = String(date.getHours()).padStart(2, '0');
      const minute = String(date.getMinutes()).padStart(2, '0');
      return `${year}-${month}-${day} ${hour}:${minute}`;
    }

    loadWorkerDetail();
  </script>
</body>
</html>

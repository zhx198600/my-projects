<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在册登记人员</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="page-header">
      <a href="index.html" class="back-btn">← 返回首页</a>
      <h1 class="page-title">在册登记人员</h1>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索姓名或身份证号..." oninput="filterWorkers()">
    </div>

    <div class="worker-list" id="workerList">
      <div class="loading-text">加载中...</div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <div id="loading" class="loading">加载中...</div>

  <script src="js/common.js"></script>
  <script>
    let allWorkers = [];

    async function loadWorkerList() {
      try {
        showLoading();
        const result = await apiRequest('/users/all');
        hideLoading();

        if (result.success && result.data) {
          allWorkers = result.data;
          renderWorkerList(result.data);
        } else {
          document.getElementById('workerList').innerHTML = 
            '<div class="empty-state">暂无登记人员</div>';
        }
      } catch (error) {
        hideLoading();
        console.error('加载人员列表失败', error);
        document.getElementById('workerList').innerHTML = 
          '<div class="empty-state">加载失败，请重试</div>';
      }
    }

    function renderWorkerList(workers) {
      const container = document.getElementById('workerList');
      
      if (!workers || workers.length === 0) {
        container.innerHTML = '<div class="empty-state">暂无登记人员</div>';
        return;
      }

      let html = '';
      workers.forEach(worker => {
        const examScore = worker.exam_score !== null && worker.exam_score !== undefined 
          ? `<span class="score-badge ${worker.exam_score >= 70 ? 'pass' : 'fail'}">${worker.exam_score}分</span>`
          : '<span class="score-badge">未考核</span>';
        
        const agreementStatus = worker.agreement_signed 
          ? '<span class="agreement-badge signed">已签署</span>'
          : '<span class="agreement-badge">未签署</span>';

        html += `
          <div class="worker-card" onclick="viewWorkerDetail(${worker.id})">
            <div class="worker-header">
              <div class="worker-avatar">👤</div>
              <div class="worker-basic">
                <div class="worker-name">${worker.name || '--'}</div>
                <div class="worker-idcard">${worker.id_card || '--'}</div>
              </div>
            </div>
            <div class="worker-info">
              <div class="info-item">
                <span class="info-label">手机号</span>
                <span class="info-value">${worker.phone || '--'}</span>
              </div>
              <div class="info-item">
                <span class="info-label">工种</span>
                <span class="info-value">${worker.work_type || '--'}</span>
              </div>
              <div class="info-item">
                <span class="info-label">考核成绩</span>
                ${examScore}
              </div>
              <div class="info-item">
                <span class="info-label">责任书</span>
                ${agreementStatus}
              </div>
            </div>
            <div class="worker-footer">
              <span class="register-time">登记时间：${formatDateTime(worker.created_at)}</span>
              <span class="view-detail">查看详情 →</span>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function filterWorkers() {
      const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
      
      if (!keyword) {
        renderWorkerList(allWorkers);
        return;
      }

      const filtered = allWorkers.filter(worker => {
        const name = (worker.name || '').toLowerCase();
        const idCard = (worker.id_card || '').toLowerCase();
        return name.includes(keyword) || idCard.includes(keyword);
      });

      renderWorkerList(filtered);
    }

    function viewWorkerDetail(workerId) {
      window.location.href = `worker-detail.html?id=${workerId}`;
    }

    function formatDateTime(dateStr) {
      if (!dateStr) return '--';
      const date = new Date(dateStr);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      const hour = String(date.getHours()).padStart(2, '0');
      const minute = String(date.getMinutes()).padStart(2, '0');
      return `${year}-${month}-${day} ${hour}:${minute}`;
    }

    loadWorkerList();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片处理工具 - 在线裁剪、旋转、AI抠图</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header id="header">
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                <span>图片处理工具</span>
            </div>
            <div class="header-actions">
                <button id="btnUndo" class="icon-btn" disabled title="撤销 (Ctrl+Z)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 7v6h6"></path>
                        <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
                    </svg>
                </button>
                <button id="btnRedo" class="icon-btn" disabled title="重做 (Ctrl+Y)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 7v6h-6"></path>
                        <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path>
                    </svg>
                </button>
                <button id="btnReset" class="icon-btn" disabled title="重置">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                        <path d="M3 3v5h5"></path>
                    </svg>
                </button>
                <div class="divider"></div>
                <button id="btnDownload" class="primary-btn" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    下载
                </button>
            </div>
        </header>

        <main id="main">
            <aside id="sidebar">
                <div class="sidebar-section">
                    <h3>文件操作</h3>
                    <div class="tool-group">
                        <button id="btnUpload" class="tool-btn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            <span>上传图片</span>
                        </button>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>编辑工具</h3>
                    <div class="tool-group">
                        <button id="btnCrop" class="tool-btn" disabled data-mode="crop">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M6.13 1L6 16a2 2 0 0 0 2 2h15"></path>
                                <path d="M1 6.13L16 6a2 2 0 0 1 2 2v15"></path>
                            </svg>
                            <span>裁剪</span>
                        </button>
                        <button id="btnRotate" class="tool-btn" disabled data-mode="rotate">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon points="1 4 1 10 7 10"></polygon>
                                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                            </svg>
                            <span>旋转</span>
                        </button>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>AI 工具</h3>
                    <div class="tool-group">
                        <button id="btnRemoveBg" class="tool-btn" disabled>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20.38 3.46L16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"></path>
                            </svg>
                            <span>AI 抠图</span>
                        </button>
                    </div>
                </div>

                <div class="sidebar-section" id="bgReplaceSection" style="display: none;">
                    <h3>背景替换</h3>
                    <div class="tool-group">
                        <div class="bg-colors">
                            <button class="bg-color-btn" data-color="#ffffff" style="background: #ffffff; border: 1px solid #ddd;" title="白色"></button>
                            <button class="bg-color-btn" data-color="#000000" style="background: #000000;" title="黑色"></button>
                            <button class="bg-color-btn" data-color="#f0f0f0" style="background: #f0f0f0;" title="浅灰"></button>
                            <button class="bg-color-btn" data-color="#e3f2fd" style="background: #e3f2fd;" title="浅蓝"></button>
                            <button class="bg-color-btn" data-color="#e8f5e9" style="background: #e8f5e9;" title="浅绿"></button>
                            <button class="bg-color-btn" data-color="#fff3e0" style="background: #fff3e0;" title="浅橙"></button>
                        </div>
                        <button id="btnUploadBg" class="tool-btn">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                            <span>上传背景图</span>
                        </button>
                    </div>
                </div>
            </aside>

            <section id="editor">
                <div id="uploadArea">
                    <div class="upload-placeholder">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                        <h2>拖拽图片到这里或点击上传</h2>
                        <p>支持 JPG、PNG、WebP 格式，最大 10MB</p>
                        <button id="btnUploadMain" class="primary-btn">选择图片</button>
                    </div>
                    <input type="file" id="fileInput" accept="image/*" style="display: none;">
                    <input type="file" id="bgFileInput" accept="image/*" style="display: none;">
                </div>

                <div id="canvasContainer" style="display: none;">
                    <div id="canvasWrapper">
                        <canvas id="mainCanvas"></canvas>
                        <canvas id="overlayCanvas" class="overlay-canvas"></canvas>
                    </div>
                    
                    <div id="cropControls" class="mode-controls" style="display: none;">
                        <div class="control-group">
                            <label>裁剪比例</label>
                            <div class="ratio-buttons">
                                <button class="ratio-btn active" data-ratio="free">自由</button>
                                <button class="ratio-btn" data-ratio="1:1">1:1</button>
                                <button class="ratio-btn" data-ratio="4:3">4:3</button>
                                <button class="ratio-btn" data-ratio="16:9">16:9</button>
                                <button class="ratio-btn" data-ratio="3:2">3:2</button>
                                <button class="ratio-btn" data-ratio="2:3">2:3</button>
                            </div>
                        </div>
                        <div class="control-actions">
                            <button id="btnCancelCrop" class="secondary-btn">取消</button>
                            <button id="btnApplyCrop" class="primary-btn">应用裁剪</button>
                        </div>
                    </div>

                    <div id="rotateControls" class="mode-controls" style="display: none;">
                        <div class="control-group">
                            <label>快速旋转</label>
                            <div class="rotate-buttons">
                                <button id="btnRotateLeft" class="icon-btn large" title="逆时针旋转 90°">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="1 4 1 10 7 10"></polyline>
                                        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                                    </svg>
                                </button>
                                <button id="btnRotate180" class="icon-btn large" title="旋转 180°">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M17 1l4 4-4 4"></path>
                                        <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                                        <path d="M7 23l-4-4 4-4"></path>
                                        <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                                    </svg>
                                </button>
                                <button id="btnRotateRight" class="icon-btn large" title="顺时针旋转 90°">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polygon points="23 4 23 10 17 10"></polygon>
                                        <path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="control-group">
                            <label>角度: <span id="angleValue">0</span>°</label>
                            <input type="range" id="angleSlider" min="0" max="360" value="0" step="1">
                        </div>
                        <div class="control-actions">
                            <button id="btnCancelRotate" class="secondary-btn">取消</button>
                            <button id="btnApplyRotate" class="primary-btn">应用旋转</button>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer id="footer">
            <div id="imageInfo" style="display: none;">
                <span id="fileName"></span>
                <span class="separator">|</span>
                <span id="imageDimensions"></span>
                <span class="separator">|</span>
                <span id="fileSize"></span>
            </div>
            <div id="statusMessage">请上传图片开始编辑</div>
        </footer>

        <div id="modal" class="modal" style="display: none;">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <div id="modalBody"></div>
            </div>
        </div>

        <div id="toastContainer"></div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>

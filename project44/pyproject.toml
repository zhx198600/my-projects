[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "md-tool"
version = "0.1.0"
description = "Markdown Toolkit - A CLI tool for processing Markdown files"
requires-python = ">=3.8"
dependencies = [
    "markdown>=3.0",
]

[project.scripts]
md-tool = "md_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
